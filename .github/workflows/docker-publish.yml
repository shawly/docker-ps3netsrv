name: Docker build and publish

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    paths-ignore:
      - "*.md"
      - "**/*.md"
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ps3netsrv
  IMAGE_TITLE: ps3netsrv
  IMAGE_DESCRIPTION: Docker container for ps3netsrv
  IMAGE_LICENSE: gpl-3.0-or-later
  # Base image that gets the tags without a base suffix (latest, 20260913, v1.12.0)
  DEFAULT_BASE: alpine
  # How many upstream ps3netsrv releases to keep building
  RELEASE_COUNT: 3

permissions:
  contents: read

jobs:
  # Work out which upstream ps3netsrv versions to build
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      releases: ${{ steps.set-matrix.outputs.releases }}
      bases: ${{ steps.set-matrix.outputs.bases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release and base matrix
        id: set-matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          matrix=$(.github/release-matrix.sh)

          echo "Releases:"
          jq -r '.releases[] | "  \(.version) (ref \(.ref), latest=\(.latest))"' <<< "$matrix"
          echo "Bases:"
          jq -r '.bases[] | "  \(.name) -> \(.tag) (alias \(.alias))"' <<< "$matrix"

          {
            echo "matrix=$(jq -c . <<< "$matrix")"
            echo "releases=$(jq -c '.releases' <<< "$matrix")"
            echo "bases=$(jq -c '.bases' <<< "$matrix")"
          } >> "$GITHUB_OUTPUT"

  # Single platform build plus a container smoke test.
  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.matrix.outputs.releases) }}
        base: ${{ fromJSON(needs.matrix.outputs.bases) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.test-buildx-cache
          key: ${{ runner.os }}-test-buildx-${{ matrix.base.name }}-${{ matrix.release.version }}
          restore-keys: |
            ${{ runner.os }}-test-buildx-${{ matrix.base.name }}-${{ matrix.release.version }}
            ${{ runner.os }}-test-buildx-${{ matrix.base.name }}-

      - name: Test build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: ${{ matrix.base.dockerfile }}
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            BUILD_FROM_GIT=${{ matrix.release.edge }}
            PS3NETSRV_SRC_REF=${{ matrix.release.ref }}
            PS3NETSRV_VERSION=${{ matrix.release.version }}
          tags: ps3netsrv:test
          cache-from: type=local,src=/tmp/.test-buildx-cache
          cache-to: type=local,dest=/tmp/.test-buildx-cache-new

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.test-buildx-cache
          mv /tmp/.test-buildx-cache-new /tmp/.test-buildx-cache

      - name: Smoke test the container
        env:
          IS_EDGE: ${{ matrix.release.edge }}
          VERSION: ${{ matrix.release.version }}
        run: |
          set -euo pipefail

          # An edge build stamps the current date, so only assert the banner
          if [ "${IS_EDGE}" = "true" ]; then
            pattern="ps3netsrv build "
          else
            pattern="ps3netsrv build ${VERSION}"
          fi

          echo "Creating test game structure..."
          sudo bash tests/setup-test-structure.sh

          echo "Starting ps3netsrv container..."
          docker run -d --name ps3netsrv-test \
            -e PS3NETSRV_FIX_PERMISSIONS=true \
            -v "$PWD/tests/games:/games" \
            ps3netsrv:test

          echo "Waiting up to 60s for '${pattern}' to report in..."
          for _ in $(seq 1 60); do
            if docker logs ps3netsrv-test 2>&1 | grep -q "${pattern}"; then
              docker logs ps3netsrv-test
              echo "Container started successfully."
              docker rm -f ps3netsrv-test >/dev/null
              exit 0
            fi
            sleep 1
          done

          echo "ps3netsrv did not start in time:"
          docker logs ps3netsrv-test
          docker rm -f ps3netsrv-test >/dev/null
          exit 1

      - name: Verify both binary flavours run
        run: |
          set -euo pipefail
          # ps3netsrv prints its usage and exits 255 when given no arguments,
          # so assert on the banner rather than on the exit status.
          for flavour in mbedtls polarssl; do
            echo "--- ps3netsrv-${flavour} ---"
            out=$(docker run --rm --entrypoint "/usr/bin/ps3netsrv-${flavour}" ps3netsrv:test 2>&1 || true)
            head -1 <<< "${out}"
            if ! grep -q 'ps3netsrv build' <<< "${out}"; then
              echo "ps3netsrv-${flavour} did not print a version banner" >&2
              exit 1
            fi
          done

  # Multi platform build and push.
  build:
    needs: [matrix, test]
    # Only refs that actually publish are worth a four platform build.
    # Release tags do not need their own run: .github/release.json travels with
    # the release commit, so the main build already pushes the vX.Y.Z tags.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.matrix.outputs.releases) }}
        base: ${{ fromJSON(needs.matrix.outputs.bases) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare tags
        id: prep
        env:
          RELEASE: ${{ toJSON(matrix.release) }}
          BASE: ${{ toJSON(matrix.base) }}
        run: |
          set -euo pipefail

          DOCKERIO_IMAGE="docker.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          GHCRIO_IMAGE="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"

          mapfile -t tags < <(.github/list-tags.sh "$RELEASE" "$BASE" "$(cat .github/release.json)")

          echo "Tags:"
          printf '  %s\n' "${tags[@]}"

          image_tags=""
          for tag in "${tags[@]}"; do
            image_tags="${image_tags}${image_tags:+,}${DOCKERIO_IMAGE}:${tag},${GHCRIO_IMAGE}:${tag}"
          done

          {
            echo "tags=${image_tags}"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.base.name }}-${{ matrix.release.version }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.base.name }}-${{ matrix.release.version }}
            ${{ runner.os }}-buildx-${{ matrix.base.name }}-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          file: ${{ matrix.base.dockerfile }}
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            BUILD_FROM_GIT=${{ matrix.release.edge }}
            PS3NETSRV_SRC_REF=${{ matrix.release.ref }}
            PS3NETSRV_VERSION=${{ matrix.release.version }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.release.version }}
            org.opencontainers.image.base.name=${{ matrix.base.name }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSE }}
          annotations: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.release.version }}
            org.opencontainers.image.base.name=${{ matrix.base.name }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Regenerate the supported tags table in README.md
  update-readme:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_SCOPED_TOKEN }}
          ref: main

      - name: Render supported tags
        env:
          MATRIX: ${{ needs.matrix.outputs.matrix }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: .github/render-readme-tags.sh "$REPO_URL" "$MATRIX"

      - name: Commit updated README.md
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "README.md already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs(README): update supported tags"
          git push
